{{- define "main" }}

<div class="search-shell">
    <header class="page-header">
        <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}</h1>
        {{- if .Description }}
        <div class="post-description">
            {{ .Description }}
        </div>
        {{- end }}
    </header>

    <div id="searchbox" class="searchbox">
        <div class="searchbar">
            <span class="search-glyph" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default "Search writeups..." }}"
                aria-label="search" type="search" autocomplete="off" maxlength="64">
            <kbd aria-hidden="true">/</kbd>
        </div>
        <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
    </div>
</div>

<script>
    document.addEventListener("keydown", function (e) {
        if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
        var el = document.activeElement;
        if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
        e.preventDefault();
        var input = document.getElementById("searchInput");
        if (input && !input.disabled) input.focus();
    });
</script>

{{- end }}{{/* end main */}}

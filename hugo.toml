baseURL = 'https://gadak-h1.github.io/'
title = 'GaDaK-H1 Pentest Notes'
theme = 'PaperMod'
enableRobotsTXT = true

[languages]
    [languages.en]
        locale = 'en-us'
        label = 'English'
        weight = 1

[pagination]
pagerSize = 10

[taxonomies]
category = 'categories'
tag = 'tags'

# JSON output builds the client-side search index (index.json)
[outputs]
home = ['HTML', 'RSS', 'JSON']

# ------------------------------------------------------------------ content
[params]
ShowReadingTime = true
ShowShareButtons = false
ShowCodeCopyButtons = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowToc = true
TocOpen = false
defaultTheme = 'dark'
disableThemeToggle = true

[params.label]
text = 'GaDaK-H1'
icon = 'favicon.ico'

[params.homeInfoParams]
Title = 'GaDaK-H1'
Content = 'Writeups, payloads, and practical pentesting methodology'
AlignSocialIconsTo = 'left'

[[params.socialIcons]]
name = 'telegram'
title = 'Telegram'
url = 'https://t.me/SirGaDak'

[[params.socialIcons]]
name = 'facebook'
title = 'Facebook'
url = 'https://www.facebook.com/share/18vEKwrdjD/'

[[params.socialIcons]]
name = 'github'
title = 'GitHub'
url = 'https://github.com/GaDaK-H1'

